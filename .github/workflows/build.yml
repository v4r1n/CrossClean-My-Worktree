name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build archives
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            ./scripts/dist.sh "$GITHUB_REF_NAME"
          else
            ./scripts/dist.sh "dev-${GITHUB_SHA::7}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CleanMyWT
          path: dist/*

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > notes.md <<NOTES
          ## Install

          Download the zip for your computer, unzip it and run **cleanmywt** (\`cleanmywt.exe\` on Windows).
          It opens Clean My Worktree in your browser. \`wtscan\` is the command-line report.

          | Computer | File |
          | --- | --- |
          | Windows (most PCs) | \`CleanMyWT-${VERSION}-windows-amd64.zip\` |
          | Windows on Arm | \`CleanMyWT-${VERSION}-windows-arm64.zip\` |
          | Mac with Apple silicon | \`CleanMyWT-${VERSION}-darwin-arm64.zip\` |
          | Intel Mac | \`CleanMyWT-${VERSION}-darwin-amd64.zip\` |
          | Linux | \`CleanMyWT-${VERSION}-linux-amd64.zip\` / \`linux-arm64\` |

          Requires git. See the [README](https://github.com/${GITHUB_REPOSITORY}#readme) for first-run notes
          (Windows SmartScreen, macOS Gatekeeper). \`SHA256SUMS.txt\` lists checksums.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Clean My Worktree ${VERSION}" \
            --notes-file notes.md
